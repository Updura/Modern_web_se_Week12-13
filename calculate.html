<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Calculate Grade</title>
</head>
<body>
    <p><b>กรอกคะแนน:</b></p>

    <input type="number" id="scoreInput" placeholder="0 - 100">

    <button onclick="runGrade()">คำนวณเกรด</button>

    <br><br>

    <div id="outputBox">ผลลัพธ์จะแสดงที่นี่...</div>

    <script>

        function calculateGrade(score) {

            if (score >= 80) {
                return "A";
            } else if (score >= 70) {
                return "B";
            } else if (score >= 60) {
                return "C";
            } else if (score >= 50) {
                return "D";
            } else {
                return "F";
            }

        }

        function runGrade() {

            const output = [];

            let score = Number(
                document.getElementById("scoreInput").value
            );

            if (isNaN(score) || score < 0 || score > 100) {

                output.push("⚠ กรุณากรอกคะแนน 0-100");

                document.getElementById("outputBox").textContent =
                    output.join("\n");

                return;
            }

            let grade = calculateGrade(score);

            let result;

            if (score >= 50) {
                result = "ผ่าน";
            } else {
                result = "ไม่ผ่าน";
            }

            output.push("คะแนน: " + score);
            output.push("เกรดที่ได้: " + grade);
            output.push("ผลสอบ: " + result);

            document.getElementById("outputBox").textContent =
                output.join("\n");

            console.log("คะแนน:", score);
            console.log("เกรดที่ได้:", grade);
            console.log("ผลสอบ:", result);

        }

    </script>

</body>
</html>
